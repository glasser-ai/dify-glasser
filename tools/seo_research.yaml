identity:
  name: seo_research
  author: glasser-ai
  label:
    en_US: Keywords & SEO
    zh_Hans: 关键词与 SEO
    ja_JP: キーワードとSEO
    pt_BR: Palavras-chave e SEO
description:
  human:
    en_US: Keyword volume and difficulty, keyword ideas, domain traffic and ranking keywords, backlinks, domain rating. Data from Semrush and Ahrefs.
    zh_Hans: 查关键词搜索量与难度、拓展词、域名流量与排名词、外链、域名评分。数据来自 Semrush 与 Ahrefs。
    ja_JP: キーワードのボリュームと難易度、キーワード候補、ドメインのトラフィックとランキングキーワード、被リンク、ドメインレーティング。データはSemrushとAhrefsから。
    pt_BR: Volume e dificuldade de palavras-chave, ideias de palavras-chave, tráfego e palavras-chave de um domínio, backlinks, domain rating. Dados da Semrush e Ahrefs.
  llm: "Keyword volume and difficulty, keyword ideas, a domain's organic traffic, ranking keywords, backlinks and domain rating. Use this when the user asks for SEO metrics of a keyword or a domain."
parameters:
- name: action
  type: select
  required: false
  label:
    en_US: Action
    zh_Hans: 操作
    ja_JP: アクション
    pt_BR: Ação
  human_description:
    en_US: What to do; see the tool description.
    zh_Hans: 要做的事；见工具说明。
    ja_JP: 実行内容。ツールの説明を参照。
    pt_BR: O que fazer; veja a descrição da ferramenta.
  options:
  - value: keyword_overview
    label:
      en_US: Keyword metrics
      zh_Hans: 关键词指标
      ja_JP: キーワード指標
      pt_BR: Métricas de palavra-chave
  - value: keyword_ideas
    label:
      en_US: Keyword ideas
      zh_Hans: 关键词拓展
      ja_JP: キーワード候補
      pt_BR: Ideias de palavras-chave
  - value: serp
    label:
      en_US: Google results for a keyword
      zh_Hans: 关键词的 Google 结果
      ja_JP: キーワードのGoogle結果
      pt_BR: Resultados do Google para uma palavra-chave
  - value: domain_overview
    label:
      en_US: Domain organic overview
      zh_Hans: 域名自然流量概览
      ja_JP: ドメインのオーガニック概要
      pt_BR: Visão geral orgânica do domínio
  - value: ranked_keywords
    label:
      en_US: Keywords a domain ranks for
      zh_Hans: 域名排名关键词
      ja_JP: ドメインのランキングキーワード
      pt_BR: Palavras-chave em que o domínio rankeia
  - value: organic_competitors
    label:
      en_US: Organic search competitors
      zh_Hans: 自然搜索竞争对手
      ja_JP: オーガニック検索の競合
      pt_BR: Concorrentes na busca orgânica
  - value: backlinks_overview
    label:
      en_US: Backlink totals
      zh_Hans: 外链总览
      ja_JP: 被リンク総計
      pt_BR: Totais de backlinks
  - value: backlinks
    label:
      en_US: Backlinks list
      zh_Hans: 外链列表
      ja_JP: 被リンク一覧
      pt_BR: Lista de backlinks
  - value: referring_domains
    label:
      en_US: Referring domains
      zh_Hans: 引荐域名
      ja_JP: 参照ドメイン
      pt_BR: Domínios de referência
  - value: domain_rating
    label:
      en_US: Domain rating
      zh_Hans: 域名评分
      ja_JP: ドメインレーティング
      pt_BR: Domain Rating
  default: keyword_overview
  llm_description: Default keyword_overview. keyword_overview takes keywords (several at once); keyword_ideas and serp take exactly one keyword in keywords; domain_overview, ranked_keywords, organic_competitors (domains ranking for the same keywords), backlinks_overview, backlinks, referring_domains and domain_rating take domain.
  form: llm
- name: provider
  type: select
  required: false
  label:
    en_US: Provider
    zh_Hans: 数据来源
    ja_JP: プロバイダー
    pt_BR: Provider
  human_description:
    en_US: Which data provider to use. Auto lets Glasser pick a good default for the action.
    zh_Hans: 使用哪家数据提供方。auto 由 Glasser 为该操作选择默认来源。
    ja_JP: 使用するデータプロバイダー。autoならGlasserがアクションに応じて選択。
    pt_BR: Qual provedor de dados usar. Auto deixa o Glasser escolher um bom padrão para a ação.
  options:
  - value: auto
    label:
      en_US: Auto (Glasser picks)
      zh_Hans: 自动（由 Glasser 选择）
      ja_JP: 自動（Glasserが選択）
      pt_BR: Automático (Glasser escolhe)
  - value: semrush
    label:
      en_US: Semrush
      zh_Hans: Semrush
      ja_JP: Semrush
      pt_BR: Semrush
  - value: serpstat
    label:
      en_US: Serpstat
      zh_Hans: Serpstat
      ja_JP: Serpstat
      pt_BR: Serpstat
  - value: dataforseo
    label:
      en_US: DataForSEO
      zh_Hans: DataForSEO
      ja_JP: DataForSEO
      pt_BR: DataForSEO
  - value: ahrefs
    label:
      en_US: Ahrefs
      zh_Hans: Ahrefs
      ja_JP: Ahrefs
      pt_BR: Ahrefs
  - value: serper
    label:
      en_US: Serper
      zh_Hans: Serper
      ja_JP: Serper
      pt_BR: Serper
  default: auto
  llm_description: "Data provider: auto (default) or one of semrush, serpstat, dataforseo, ahrefs, serper. Name one only when the caller asks for that vendor."
  form: llm
- name: keywords
  type: string
  required: false
  label:
    en_US: Keywords
    zh_Hans: 关键词
    ja_JP: キーワード
    pt_BR: Palavras-chave
  human_description:
    en_US: "Keywords to look up, e.g. 'espresso machine'. Comma-separated, up to 20."
    zh_Hans: "要查的关键词，如 'espresso machine'。逗号分隔，最多 20 个。"
    ja_JP: "調べるキーワード（例: 'espresso machine'）。カンマ区切り、最大20件。"
    pt_BR: "Palavras-chave a consultar, por exemplo 'espresso machine'. Separado por vírgula, até 20."
  llm_description: "Keywords to look up, e.g. 'espresso machine'. Comma-separated, up to 20."
  form: llm
- name: domain
  type: string
  required: false
  label:
    en_US: Domain
    zh_Hans: 域名
    ja_JP: ドメイン
    pt_BR: Domínio
  human_description:
    en_US: A company website domain, e.g. stripe.com.
    zh_Hans: 公司网站域名，如 stripe.com。
    ja_JP: "企業サイトのドメイン（例: stripe.com）。"
    pt_BR: O domínio do site da empresa, por exemplo stripe.com.
  llm_description: A website domain such as stripe.com. A full URL is accepted and reduced to its host.
  form: llm
- name: country
  type: string
  required: false
  label:
    en_US: Country
    zh_Hans: 国家
    ja_JP: 国
    pt_BR: País
  human_description:
    en_US: Two-letter country code or country name, e.g. us, gb, Germany (default us).
    zh_Hans: 两位国家代码或国家名，如 us、gb、Germany（默认 us）。
    ja_JP: "2文字の国コードまたは国名（例: us, gb, Germany、デフォルトus）。"
    pt_BR: Código de país de duas letras ou nome do país, por exemplo us, gb, Germany (padrão us).
  llm_description: Country as a two-letter ISO code or a country name, e.g. us, gb, de, Germany. Default us. An unsupported country is refused with the supported list.
  form: llm
extra:
  python:
    source: tools/seo_research.py
