identity:
  name: web_research
  author: glasser-ai
  label:
    en_US: Web Research
    zh_Hans: 网络研究
    ja_JP: ウェブリサーチ
    pt_BR: Pesquisa na web
description:
  human:
    en_US: Search the web, news and places, read page content, get answers with sources. Data from Serper and Exa.
    zh_Hans: 搜网页、新闻和地点，读取页面内容，得到带来源的答案。数据来自 Serper 与 Exa。
    ja_JP: ウェブ、ニュース、場所を検索し、ページ本文を読み取り、出典付きの回答を得る。データはSerperとExaから。
    pt_BR: Pesquise a web, notícias e lugares, leia o conteúdo de páginas, obtenha respostas com fontes. Dados da Serper e Exa.
  llm: Search the web, news, places, scholar, shopping, images or videos; read a web page; get an answer with sources. Use this when the user needs live information from the internet.
parameters:
- name: action
  type: select
  required: false
  label:
    en_US: Action
    zh_Hans: 操作
    ja_JP: アクション
    pt_BR: Ação
  human_description:
    en_US: What to do; see the tool description.
    zh_Hans: 要做的事；见工具说明。
    ja_JP: 実行内容。ツールの説明を参照。
    pt_BR: O que fazer; veja a descrição da ferramenta.
  options:
  - value: search
    label:
      en_US: Search
      zh_Hans: 搜索
      ja_JP: 検索
      pt_BR: Buscar
  - value: news
    label:
      en_US: News
      zh_Hans: 新闻
      ja_JP: ニュース
      pt_BR: Notícias
  - value: places
    label:
      en_US: Places / local businesses
      zh_Hans: 地点 / 本地商家
      ja_JP: 場所・ローカルビジネス
      pt_BR: Lugares / negócios locais
  - value: scholar
    label:
      en_US: Academic papers
      zh_Hans: 学术论文
      ja_JP: 学術論文
      pt_BR: Artigos acadêmicos
  - value: shopping
    label:
      en_US: Shopping
      zh_Hans: 商品
      ja_JP: ショッピング
      pt_BR: Compras
  - value: images
    label:
      en_US: Images
      zh_Hans: 图片
      ja_JP: 画像
      pt_BR: Imagens
  - value: videos
    label:
      en_US: Videos
      zh_Hans: 视频
      ja_JP: 動画
      pt_BR: Vídeos
  - value: answer
    label:
      en_US: Answer a question from the web
      zh_Hans: 从网页回答问题
      ja_JP: ウェブから質問に回答
      pt_BR: Responder uma pergunta a partir da web
  - value: scrape
    label:
      en_US: Read a web page
      zh_Hans: 读取网页
      ja_JP: ウェブページを読む
      pt_BR: Ler uma página web
  - value: similar
    label:
      en_US: Pages similar to a URL
      zh_Hans: 与 URL 相似的页面
      ja_JP: URLに類似したページ
      pt_BR: Páginas semelhantes a uma URL
  default: search
  llm_description: Default search. search, news, places, scholar, shopping, images, videos and answer take query; scrape and similar take url.
  form: llm
- name: provider
  type: select
  required: false
  label:
    en_US: Provider
    zh_Hans: 数据来源
    ja_JP: プロバイダー
    pt_BR: Provider
  human_description:
    en_US: Which data provider to use. Auto lets Glasser pick a good default for the action.
    zh_Hans: 使用哪家数据提供方。auto 由 Glasser 为该操作选择默认来源。
    ja_JP: 使用するデータプロバイダー。autoならGlasserがアクションに応じて選択。
    pt_BR: Qual provedor de dados usar. Auto deixa o Glasser escolher um bom padrão para a ação.
  options:
  - value: auto
    label:
      en_US: Auto (Glasser picks)
      zh_Hans: 自动（由 Glasser 选择）
      ja_JP: 自動（Glasserが選択）
      pt_BR: Automático (Glasser escolhe)
  - value: serper
    label:
      en_US: Serper
      zh_Hans: Serper
      ja_JP: Serper
      pt_BR: Serper
  - value: serpapi
    label:
      en_US: SerpApi
      zh_Hans: SerpApi
      ja_JP: SerpApi
      pt_BR: SerpApi
  - value: exa
    label:
      en_US: Exa
      zh_Hans: Exa
      ja_JP: Exa
      pt_BR: Exa
  - value: dataforseo
    label:
      en_US: DataForSEO
      zh_Hans: DataForSEO
      ja_JP: DataForSEO
      pt_BR: DataForSEO
  default: auto
  llm_description: "Data provider: auto (default) or one of serper, serpapi, exa, dataforseo. Name one only when the caller asks for that vendor."
  form: llm
- name: query
  type: string
  required: false
  label:
    en_US: Query
    zh_Hans: 查询
    ja_JP: クエリ
    pt_BR: Consulta
  human_description:
    en_US: Search phrase or question.
    zh_Hans: 搜索词或问题。
    ja_JP: 検索語または質問。
    pt_BR: Termo de busca ou pergunta.
  llm_description: Search phrase or question.
  form: llm
- name: url
  type: string
  required: false
  label:
    en_US: URL
    zh_Hans: URL
    ja_JP: URL
    pt_BR: URL
  human_description:
    en_US: A full http(s) URL.
    zh_Hans: 完整的 http(s) URL。
    ja_JP: 完全なhttp(s) URL。
    pt_BR: Uma URL http(s) completa.
  llm_description: A full http(s) URL.
  form: llm
- name: country
  type: string
  required: false
  label:
    en_US: Country
    zh_Hans: 国家
    ja_JP: 国
    pt_BR: País
  human_description:
    en_US: Two-letter country code or country name, e.g. us, gb, Germany (default us).
    zh_Hans: 两位国家代码或国家名，如 us、gb、Germany（默认 us）。
    ja_JP: "2文字の国コードまたは国名（例: us, gb, Germany、デフォルトus）。"
    pt_BR: Código de país de duas letras ou nome do país, por exemplo us, gb, Germany (padrão us).
  llm_description: Country for search-type actions, as a two-letter ISO code or a country name. Default us. Not for scrape or similar. Refused with 400 when the named provider cannot apply it.
  form: llm
extra:
  python:
    source: tools/web_research.py
