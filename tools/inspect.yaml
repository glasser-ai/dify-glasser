identity:
  name: "inspect"
  author: "glasser-ai"
  label:
    en_US: "Inspect endpoint"
    zh_Hans: "查看端点"
description:
  human:
    en_US: "The execution contract of one endpoint: provider-native input schema, exact price with every charge clause, endpoint version, run mode and timeout."
    zh_Hans: "一个端点的执行契约：provider 原生输入 schema、含全部计费条款的精确价格、端点版本、运行模式和超时。"
  llm: "Get one endpoint's execution contract: provider-native input schema, exact price with every charge clause, current endpoint_version, run mode and timeout. Always inspect before the first run of an endpoint, and pass the endpoint_version you saw to run. Selecting an endpoint_version does not lock Price; new Runs use the current Price at admission."
parameters:
  - name: provider
    type: string
    required: true
    label:
      en_US: "Provider"
      zh_Hans: "Provider"
    human_description:
      en_US: "The provider slug from search, e.g. 'ahrefs'."
      zh_Hans: "search 返回的 provider slug，如 'ahrefs'。"
    llm_description: "The provider slug exactly as search returned it, e.g. 'pdl', 'serper', 'ahrefs'."
    form: llm
  - name: endpoint
    type: string
    required: true
    label:
      en_US: "Endpoint"
      zh_Hans: "Endpoint"
    human_description:
      en_US: "The endpoint path from search, e.g. '/v3/public/domain-rating-free'."
      zh_Hans: "search 返回的 endpoint 路径，如 '/v3/public/domain-rating-free'。"
    llm_description: "The endpoint path exactly as search returned it, starting with '/'."
    form: llm
  - name: endpoint_version
    type: number
    required: false
    label:
      en_US: "Endpoint version"
      zh_Hans: "端点版本"
    human_description:
      en_US: "A supported version to inspect. Empty means the default version."
      zh_Hans: "要查看的受支持版本。留空为默认版本。"
    llm_description: "Optional. A supported endpoint_version to inspect, including an older one. Omit for the default."
    form: llm
extra:
  python:
    source: tools/inspect.py
