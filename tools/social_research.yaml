identity:
  name: social_research
  author: glasser-ai
  label:
    en_US: Social Media Search
    zh_Hans: 社交媒体搜索
    ja_JP: SNS検索
    pt_BR: Busca em redes sociais
description:
  human:
    en_US: Search posts, profiles and channels on Reddit, X, YouTube, TikTok, Instagram and LinkedIn, read-only. Data from ScrapeCreators.
    zh_Hans: 搜 Reddit、X、YouTube、TikTok、Instagram、LinkedIn 上的帖子、主页与频道，只读。数据来自 ScrapeCreators。
    ja_JP: Reddit、X、YouTube、TikTok、Instagram、LinkedInの投稿、プロフィール、チャンネルを検索。読み取り専用。データはScrapeCreatorsから。
    pt_BR: Pesquise posts, perfis e canais no Reddit, X, YouTube, TikTok, Instagram e LinkedIn, somente leitura. Dados da ScrapeCreators.
  llm: Search posts, profiles and channels on Reddit, X, YouTube, TikTok, Instagram and LinkedIn. Use this when the user asks what people say on social media or about a social account.
parameters:
- name: platform
  type: select
  required: true
  label:
    en_US: Platform
    zh_Hans: 平台
    ja_JP: プラットフォーム
    pt_BR: Plataforma
  human_description:
    en_US: The social network to search.
    zh_Hans: 要搜索的社交平台。
    ja_JP: 検索するSNS。
    pt_BR: A rede social a pesquisar.
  options:
  - value: reddit
    label:
      en_US: Reddit
      zh_Hans: Reddit
      ja_JP: Reddit
      pt_BR: Reddit
  - value: x
    label:
      en_US: X
      zh_Hans: X
      ja_JP: X
      pt_BR: X
  - value: youtube
    label:
      en_US: YouTube
      zh_Hans: YouTube
      ja_JP: YouTube
      pt_BR: YouTube
  - value: tiktok
    label:
      en_US: TikTok
      zh_Hans: TikTok
      ja_JP: TikTok
      pt_BR: TikTok
  - value: instagram
    label:
      en_US: Instagram
      zh_Hans: Instagram
      ja_JP: Instagram
      pt_BR: Instagram
  - value: linkedin
    label:
      en_US: LinkedIn
      zh_Hans: LinkedIn
      ja_JP: LinkedIn
      pt_BR: LinkedIn
  llm_description: "One of: reddit, x, youtube, tiktok, instagram, linkedin."
  form: llm
- name: mode
  type: select
  required: false
  label:
    en_US: Mode
    zh_Hans: 模式
    ja_JP: モード
    pt_BR: Modo
  human_description:
    en_US: What to fetch; see the tool description.
    zh_Hans: 要获取的内容；见工具说明。
    ja_JP: 取得する内容。ツールの説明を参照。
    pt_BR: O que buscar; veja a descrição da ferramenta.
  options:
  - value: search
    label:
      en_US: Search
      zh_Hans: 搜索
      ja_JP: 検索
      pt_BR: Buscar
  - value: profile
    label:
      en_US: Profile or channel
      zh_Hans: 主页或频道
      ja_JP: プロフィール/チャンネル
      pt_BR: Perfil ou canal
  - value: feed
    label:
      en_US: Recent posts
      zh_Hans: 最近帖子
      ja_JP: 最近の投稿
      pt_BR: Posts recentes
  - value: post
    label:
      en_US: One post
      zh_Hans: 单条帖子
      ja_JP: 1件の投稿
      pt_BR: Um post
  - value: find
    label:
      en_US: Find social profiles
      zh_Hans: 查找社交账号
      ja_JP: SNSプロフィールを検索
      pt_BR: Encontrar perfis sociais
  default: search
  llm_description: "Default search. search: posts matching query. profile: the account itself — bio, follower counts, links — from handle (reddit: the subreddit; linkedin: url of a person's profile or a company page). feed: the account's recent posts or videos, from handle (linkedin: url of a company page). post: one post or video from url. find: an account's other social profiles, from handle."
  form: llm
- name: provider
  type: select
  required: false
  label:
    en_US: Provider
    zh_Hans: 数据来源
    ja_JP: プロバイダー
    pt_BR: Provider
  human_description:
    en_US: Which data provider to use. Auto lets Glasser pick a good default for the action.
    zh_Hans: 使用哪家数据提供方。auto 由 Glasser 为该操作选择默认来源。
    ja_JP: 使用するデータプロバイダー。autoならGlasserがアクションに応じて選択。
    pt_BR: Qual provedor de dados usar. Auto deixa o Glasser escolher um bom padrão para a ação.
  options:
  - value: auto
    label:
      en_US: Auto (Glasser picks)
      zh_Hans: 自动（由 Glasser 选择）
      ja_JP: 自動（Glasserが選択）
      pt_BR: Automático (Glasser escolhe)
  - value: scrapecreators
    label:
      en_US: ScrapeCreators
      zh_Hans: ScrapeCreators
      ja_JP: ScrapeCreators
      pt_BR: ScrapeCreators
  - value: apify
    label:
      en_US: Apify
      zh_Hans: Apify
      ja_JP: Apify
      pt_BR: Apify
  - value: tikhub
    label:
      en_US: TikHub
      zh_Hans: TikHub
      ja_JP: TikHub
      pt_BR: TikHub
  default: auto
  llm_description: "Data provider: auto (default) or one of scrapecreators, apify, tikhub. Name one only when the caller asks for that vendor."
  form: llm
- name: query
  type: string
  required: false
  label:
    en_US: Query
    zh_Hans: 查询
    ja_JP: クエリ
    pt_BR: Consulta
  human_description:
    en_US: Search phrase or question.
    zh_Hans: 搜索词或问题。
    ja_JP: 検索語または質問。
    pt_BR: Termo de busca ou pergunta.
  llm_description: Search phrase or question.
  form: llm
- name: handle
  type: string
  required: false
  label:
    en_US: Handle
    zh_Hans: 账号
    ja_JP: ハンドル
    pt_BR: Handle
  human_description:
    en_US: A username or handle without @, or a subreddit name.
    zh_Hans: 用户名或账号（不带 @），或 subreddit 名称。
    ja_JP: '@なしのユーザー名またはハンドル、あるいはsubreddit名。'
    pt_BR: Um nome de usuário ou handle sem @, ou o nome de um subreddit.
  llm_description: A username without @, or a subreddit name without r/.
  form: llm
- name: url
  type: string
  required: false
  label:
    en_US: URL
    zh_Hans: URL
    ja_JP: URL
    pt_BR: URL
  human_description:
    en_US: A full http(s) URL.
    zh_Hans: 完整的 http(s) URL。
    ja_JP: 完全なhttp(s) URL。
    pt_BR: Uma URL http(s) completa.
  llm_description: A full http(s) URL.
  form: llm
extra:
  python:
    source: tools/social_research.py
