identity:
  name: runs_get
  author: glasser-ai
  label:
    en_US: Get run
    zh_Hans: 获取 run
    ja_JP: runを取得
    pt_BR: Obter run
description:
  human:
    en_US: "One run by id: status, output, provider response, failure, exact charge and charge basis. Optionally waits for an in-flight run to settle."
    zh_Hans: 按 id 获取一个 run：状态、输出、provider 响应、失败信息、精确扣费与计费依据。可选等待未完成的 run 结束。
    ja_JP: "idで1つのrunを取得: ステータス、出力、providerの応答、失敗情報、正確な課金額と課金根拠。進行中のrunの確定を待つこともできます。"
    pt_BR: "Um run por id: status, saída, resposta do provider, falha, cobrança exata e base da cobrança. Opcionalmente aguarda um run em andamento ser liquidado."
  llm: "Get one run by run_id: status, output, provider_response, failure, charge_usd, charge_basis. Status and charge are independent; a FAILED run can carry a non-zero charge. Use it to poll a QUEUED or RUNNING run."
parameters:
- name: run_id
  type: string
  required: true
  label:
    en_US: Run id
    zh_Hans: Run id
    ja_JP: Run id
    pt_BR: Run id
  human_description:
    en_US: The id of the run, from run or runs_list.
    zh_Hans: run 的 id，来自 run 或 runs_list。
    ja_JP: runまたはruns_listが返したrunのid。
    pt_BR: O id do run, retornado por run ou runs_list.
  llm_description: The run id returned by run or runs_list.
  form: llm
- name: wait
  type: boolean
  required: false
  default: false
  label:
    en_US: Wait until terminal
    zh_Hans: 等待结束
    ja_JP: 終了まで待つ
    pt_BR: Aguardar até terminal
  human_description:
    en_US: Poll until the run is COMPLETED, FAILED or STOPPED, up to the wait timeout.
    zh_Hans: 轮询直到 run 变为 COMPLETED、FAILED 或 STOPPED，不超过等待超时。
    ja_JP: runがCOMPLETED、FAILED、STOPPEDのいずれかになるまで、待機タイムアウトを上限にポーリングします。
    pt_BR: Consulta até o run ficar COMPLETED, FAILED ou STOPPED, até o tempo limite de espera.
  llm_description: Poll until the run is terminal, up to wait_timeout seconds.
  form: form
- name: wait_timeout
  type: number
  required: false
  default: 180
  min: 1
  max: 200
  label:
    en_US: Wait timeout (seconds)
    zh_Hans: 等待超时（秒）
    ja_JP: 待機タイムアウト（秒）
    pt_BR: Tempo limite de espera (segundos)
  human_description:
    en_US: How long to wait, 1 to 200 seconds (default 180).
    zh_Hans: 最长等待时间，1 到 200 秒（默认 180）。
    ja_JP: 待つ最大時間、1〜200秒（デフォルト180）。
    pt_BR: Quanto tempo esperar, de 1 a 200 segundos (padrão 180).
  llm_description: Seconds to wait before returning the run as is.
  form: form
extra:
  python:
    source: tools/runs_get.py
