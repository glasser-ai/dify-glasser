identity:
  name: company_intelligence
  author: glasser-ai
  label:
    en_US: Company Intelligence
    zh_Hans: 公司情报
    ja_JP: 企業インテリジェンス
    pt_BR: Inteligência de empresas
description:
  human:
    en_US: Company data from Apollo, People Data Labs, Hunter, PredictLeads, BuiltWith, DataForSEO and Ahrefs via Glasser — from a domain, get the company profile and firmographics, technology stack, website traffic, competitors, funding rounds and news. For account research, competitive analysis and sales preparation.
    zh_Hans: 由 Glasser 提供的 Apollo、People Data Labs、Hunter、PredictLeads、BuiltWith、DataForSEO 与 Ahrefs 公司数据——按域名获取公司档案与画像、技术栈、网站流量、竞争对手、融资与新闻。适用于目标客户研究、竞品分析与销售准备。
    ja_JP: Glasser経由のApollo、People Data Labs、Hunter、PredictLeads、BuiltWith、DataForSEO、Ahrefsによる企業データ——ドメインから企業プロフィールと属性、技術スタック、サイトトラフィック、競合、資金調達、ニュースを取得。アカウント調査、競合分析、営業準備に。
    pt_BR: Dados de empresas da Apollo, People Data Labs, Hunter, PredictLeads, BuiltWith, DataForSEO e Ahrefs via Glasser — a partir de um domínio, obtenha perfil e firmografia, stack de tecnologia, tráfego do site, concorrentes, rodadas de investimento e notícias. Para pesquisa de contas, análise competitiva e preparação de vendas.
  llm: "Company intelligence for one domain. action 'enrich': industry, size, revenue, HQ, funding summary. 'tech_stack': technologies the site runs. 'traffic': estimated organic traffic (dataforseo) or Similarweb-style visits (apify). 'competitors': domains competing for the same keywords, or similar companies (predictleads). 'funding': funding rounds with dates and investors. 'news': classified company events (predictleads) or Google News (serper). domain is always required. provider 'auto' picks the default per action; name one only when the user asks. Each call is one paid run; report the charge and the run URL."
parameters:
- name: action
  type: select
  required: true
  default: enrich
  options:
  - value: enrich
    label:
      en_US: Company profile
      zh_Hans: 公司档案
      ja_JP: 企業プロフィール
      pt_BR: Perfil da empresa
  - value: tech_stack
    label:
      en_US: Technology stack
      zh_Hans: 技术栈
      ja_JP: 技術スタック
      pt_BR: Stack de tecnologia
  - value: traffic
    label:
      en_US: Website traffic
      zh_Hans: 网站流量
      ja_JP: サイトトラフィック
      pt_BR: Tráfego do site
  - value: competitors
    label:
      en_US: Competitors
      zh_Hans: 竞争对手
      ja_JP: 競合
      pt_BR: Concorrentes
  - value: funding
    label:
      en_US: Funding rounds
      zh_Hans: 融资记录
      ja_JP: 資金調達
      pt_BR: Rodadas de investimento
  - value: news
    label:
      en_US: Company news
      zh_Hans: 公司新闻
      ja_JP: 企業ニュース
      pt_BR: Notícias da empresa
  label:
    en_US: Action
    zh_Hans: 操作
    ja_JP: アクション
    pt_BR: Ação
  human_description:
    en_US: What to do; see the tool description.
    zh_Hans: 要做的事；见工具说明。
    ja_JP: 実行内容。ツールの説明を参照。
    pt_BR: O que fazer; veja a descrição da ferramenta.
  llm_description: "One of: enrich, tech_stack, traffic, competitors, funding, news."
