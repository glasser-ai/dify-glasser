identity:
  name: people_search
  author: glasser-ai
  label:
    en_US: Find Prospects
    zh_Hans: 客户开发
    ja_JP: プロスペクト検索
    pt_BR: Prospecção
description:
  human:
    en_US: Find contacts by title, location or company, enrich a profile, get a work email. Data from Apollo and People Data Labs.
    zh_Hans: 按职位、地区或公司找到联系人，补全资料，拿到工作邮箱。数据来自 Apollo 与 People Data Labs。
    ja_JP: 役職・所在地・企業で連絡先を探し、プロフィールを補完し、仕事用メールを取得。データはApolloとPeople Data Labsから。
    pt_BR: Encontre contatos por cargo, localização ou empresa, enriqueça um perfil, obtenha um e-mail de trabalho. Dados da Apollo e People Data Labs.
  llm: Find B2B professionals and decision makers, enrich one person, or find a work email. Use this when the user needs people matching a title, seniority, location or company, or details about one known person.
parameters:
- name: action
  type: select
  required: false
  label:
    en_US: Action
    zh_Hans: 操作
    ja_JP: アクション
    pt_BR: Ação
  human_description:
    en_US: What to do; see the tool description.
    zh_Hans: 要做的事；见工具说明。
    ja_JP: 実行内容。ツールの説明を参照。
    pt_BR: O que fazer; veja a descrição da ferramenta.
  options:
  - value: search
    label:
      en_US: Search
      zh_Hans: 搜索
      ja_JP: 検索
      pt_BR: Buscar
  - value: enrich
    label:
      en_US: Enrich
      zh_Hans: 补全
      ja_JP: 補完
      pt_BR: Enriquecer
  - value: find_email
    label:
      en_US: Find work email
      zh_Hans: 查找工作邮箱
      ja_JP: 仕事用メールを検索
      pt_BR: Encontrar e-mail de trabalho
  default: search
  llm_description: "Default search. search: people matching job_titles, seniorities, locations, company_domain or keywords (at least one); a filter is never silently dropped — under auto a Provider that cannot apply one of the given filters is skipped, a named Provider that cannot is refused with 400. enrich: one person from linkedin_url, email, or full_name plus company_domain. find_email: the work email of full_name at company_domain."
  form: llm
- name: provider
  type: select
  required: false
  label:
    en_US: Provider
    zh_Hans: 数据来源
    ja_JP: プロバイダー
    pt_BR: Provider
  human_description:
    en_US: Which data provider to use. Auto lets Glasser pick a good default for the action.
    zh_Hans: 使用哪家数据提供方。auto 由 Glasser 为该操作选择默认来源。
    ja_JP: 使用するデータプロバイダー。autoならGlasserがアクションに応じて選択。
    pt_BR: Qual provedor de dados usar. Auto deixa o Glasser escolher um bom padrão para a ação.
  options:
  - value: auto
    label:
      en_US: Auto (Glasser picks)
      zh_Hans: 自动（由 Glasser 选择）
      ja_JP: 自動（Glasserが選択）
      pt_BR: Automático (Glasser escolhe)
  - value: apollo
    label:
      en_US: Apollo
      zh_Hans: Apollo
      ja_JP: Apollo
      pt_BR: Apollo
  - value: pdl
    label:
      en_US: People Data Labs
      zh_Hans: People Data Labs
      ja_JP: People Data Labs
      pt_BR: People Data Labs
  - value: leadmagic
    label:
      en_US: LeadMagic
      zh_Hans: LeadMagic
      ja_JP: LeadMagic
      pt_BR: LeadMagic
  - value: zoominfo
    label:
      en_US: ZoomInfo
      zh_Hans: ZoomInfo
      ja_JP: ZoomInfo
      pt_BR: ZoomInfo
  - value: hunter
    label:
      en_US: Hunter
      zh_Hans: Hunter
      ja_JP: Hunter
      pt_BR: Hunter
  - value: prospeo
    label:
      en_US: Prospeo
      zh_Hans: Prospeo
      ja_JP: Prospeo
      pt_BR: Prospeo
  default: auto
  llm_description: "Data provider: auto (default) or one of apollo, pdl, leadmagic, zoominfo, hunter, prospeo. Name one only when the caller asks for that vendor."
  form: llm
- name: job_titles
  type: string
  required: false
  label:
    en_US: Job titles
    zh_Hans: 职位
    ja_JP: 役職
    pt_BR: Cargos
  human_description:
    en_US: "Job titles, e.g. 'CTO, VP Engineering'. Comma-separated, up to 20."
    zh_Hans: "职位，如 'CTO, VP Engineering'。逗号分隔，最多 20 个。"
    ja_JP: "役職（例: 'CTO, VP Engineering'）。カンマ区切り、最大20件。"
    pt_BR: "Cargos, por exemplo 'CTO, VP Engineering'. Separado por vírgula, até 20."
  llm_description: "Job titles, e.g. 'CTO, VP Engineering'. Comma-separated, up to 20."
  form: llm
- name: seniorities
  type: string
  required: false
  label:
    en_US: Seniorities
    zh_Hans: 级别
    ja_JP: 役職レベル
    pt_BR: Senioridades
  human_description:
    en_US: "Seniority levels, e.g. 'c_suite, vp, director'. Comma-separated, up to 11."
    zh_Hans: "级别，如 'c_suite, vp, director'。逗号分隔，最多 11 个。"
    ja_JP: "役職レベル（例: 'c_suite, vp, director'）。カンマ区切り、最大11件。"
    pt_BR: "Níveis de senioridade, por exemplo 'c_suite, vp, director'. Separado por vírgula, até 11."
  llm_description: Seniority levels, one or more of owner, founder, c_suite, partner, vp, head, director, manager, senior, entry, intern. Comma-separated, up to 11.
  form: llm
- name: locations
  type: string
  required: false
  label:
    en_US: Locations
    zh_Hans: 地区
    ja_JP: 所在地
    pt_BR: Localizações
  human_description:
    en_US: Cities, states or countries. Comma-separated, up to 20.
    zh_Hans: 城市、州或国家。逗号分隔，最多 20 个。
    ja_JP: 都市、州、国。カンマ区切り、最大20件。
    pt_BR: Cidades, estados ou países. Separado por vírgula, até 20.
  llm_description: Cities, states or countries. Comma-separated, up to 20.
  form: llm
- name: company_domain
  type: string
  required: false
  label:
    en_US: Company domain
    zh_Hans: 公司域名
    ja_JP: 企業ドメイン
    pt_BR: Domínio da empresa
  human_description:
    en_US: "The employer's website domain, e.g. stripe.com."
    zh_Hans: 雇主的网站域名，如 stripe.com。
    ja_JP: "雇用主のサイトのドメイン（例: stripe.com）。"
    pt_BR: O domínio do site do empregador, por exemplo stripe.com.
  llm_description: A website domain such as stripe.com. A full URL is accepted and reduced to its host.
  form: llm
- name: full_name
  type: string
  required: false
  label:
    en_US: Full name
    zh_Hans: 全名
    ja_JP: 氏名
    pt_BR: Nome completo
  human_description:
    en_US: "The person's full name, e.g. 'Patrick Collison'."
    zh_Hans: "人物全名，如 'Patrick Collison'。"
    ja_JP: "人物の氏名（例: 'Patrick Collison'）。"
    pt_BR: "O nome completo da pessoa, por exemplo 'Patrick Collison'."
  llm_description: "The person's full name, e.g. 'Patrick Collison'."
  form: llm
- name: email
  type: string
  required: false
  label:
    en_US: Email
    zh_Hans: 邮箱
    ja_JP: メール
    pt_BR: E-mail
  human_description:
    en_US: "The person's email address."
    zh_Hans: 人物的邮箱地址。
    ja_JP: 人物のメールアドレス。
    pt_BR: O endereço de e-mail da pessoa.
  llm_description: An email address.
  form: llm
- name: linkedin_url
  type: string
  required: false
  label:
    en_US: LinkedIn URL
    zh_Hans: LinkedIn 链接
    ja_JP: LinkedIn URL
    pt_BR: URL do LinkedIn
  human_description:
    en_US: "The person's LinkedIn profile URL."
    zh_Hans: 人物的 LinkedIn 个人主页链接。
    ja_JP: 人物のLinkedInプロフィールURL。
    pt_BR: A URL do perfil do LinkedIn da pessoa.
  llm_description: "The person's LinkedIn profile URL, linkedin.com/in/<slug>. Not a company page."
  form: llm
extra:
  python:
    source: tools/people_search.py
