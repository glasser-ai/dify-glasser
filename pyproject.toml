[project]
name = "dify-glasser"
version = "0.2.0"
description = "Dify tool plugin for Glasser: paid third-party API endpoints through one Key."
requires-python = ">=3.12"
dependencies = [
    "dify_plugin>=0.9.0,<0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
