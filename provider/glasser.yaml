identity:
  author: "glasser-ai"
  name: "glasser"
  label:
    en_US: "Glasser"
    zh_Hans: "Glasser"
  description:
    en_US: "Paid third-party API endpoints for agents through one Glasser Key. Search the data sources, inspect the exact price, run, pay per call."
    zh_Hans: "一个 Glasser Key 调用付费第三方 API：搜索数据源、查看精确价格、执行、按次付费。"
  icon: "icon.svg"
  tags:
    - search
    - business
    - utilities

credentials_for_provider:
  glasser_api_key:
    type: secret-input
    required: true
    label:
      en_US: "Glasser Key"
      zh_Hans: "Glasser Key"
    placeholder:
      en_US: "gl_..."
      zh_Hans: "gl_..."
    help:
      en_US: "Create a Key in the Glasser console. Validation calls the free balance endpoint and charges nothing."
      zh_Hans: "在 Glasser 控制台创建 Key。校验只调用免费的余额接口，不产生费用。"
    url: "https://app.glasser.ai/keys"

tools:
  - tools/search.yaml
  - tools/inspect.yaml
  - tools/run.yaml
  - tools/runs_get.yaml
  - tools/runs_list.yaml
  - tools/runs_stop.yaml
  - tools/balance.yaml

extra:
  python:
    source: provider/glasser.py
