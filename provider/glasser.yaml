identity:
  author: glasser-ai
  name: glasser
  label:
    en_US: Glasser
    zh_Hans: Glasser
    ja_JP: Glasser
    pt_BR: Glasser
  description:
    en_US: Premium data for agents through one Glasser Key — web research, company intelligence, B2B prospecting, keyword & SEO research and social listening. The agent says what data it needs; Glasser picks the provider among Apollo, People Data Labs, Hunter, BuiltWith, DataForSEO, Semrush, Ahrefs, Serper, Exa and more. Pay per call.
    zh_Hans: 一个 Glasser Key 即可为智能体提供高级数据——网络研究、公司情报、客户开发、关键词与 SEO、社交聆听。Agent 只说要什么数据，Glasser 在 Apollo、People Data Labs、Hunter、BuiltWith、DataForSEO、Semrush、Ahrefs、Serper、Exa 等数据源中选择；按次付费。
    ja_JP: Glasser Keyひとつでエージェントにプレミアムデータを——ウェブリサーチ、企業インテリジェンス、B2Bプロスペクティング、キーワードとSEO、ソーシャルリスニング。エージェントは必要なデータを伝えるだけで、GlasserがApollo、People Data Labs、Hunter、BuiltWith、DataForSEO、Semrush、Ahrefs、Serper、Exaなどからプロバイダーを選択。呼び出しごとの従量課金。
    pt_BR: Dados premium para agentes com uma única Glasser Key — pesquisa na web, inteligência de empresas, prospecção B2B, palavras-chave e SEO e escuta social. O agente diz que dados precisa; o Glasser escolhe o provedor entre Apollo, People Data Labs, Hunter, BuiltWith, DataForSEO, Semrush, Ahrefs, Serper, Exa e outros. Pague por chamada.
  icon: icon.svg
  tags:
  - search
  - business
  - utilities
