# On a GitHub release: package the plugin, push the .difypkg to the personal
# fork of langgenius/dify-plugins (FORK_OWNER), and open the Marketplace PR.
# The organisation holds only source; the fork is a PR vehicle and lives
# under the account that submits. Needs the repository secret PLUGIN_ACTION:
# a token of FORK_OWNER with write access to the fork and permission to open
# PRs upstream.
name: Publish to Dify Marketplace

on:
  release:
    types: [published]

env:
  FORK_OWNER: adriansurething

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Dify plugin CLI
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/dify" \
            https://github.com/langgenius/dify-plugin-daemon/releases/latest/download/dify-plugin-linux-amd64
          chmod +x "$RUNNER_TEMP/bin/dify"

      - name: Read the manifest
        id: manifest
        run: |
          echo "name=$(grep '^name:' manifest.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "version=$(grep '^version:' manifest.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "author=$(grep '^author:' manifest.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Package
        id: package
        run: |
          PKG="${{ steps.manifest.outputs.name }}-${{ steps.manifest.outputs.version }}.difypkg"
          "$RUNNER_TEMP/bin/dify" plugin package . -o "$PKG"
          echo "file=$PKG" >> "$GITHUB_OUTPUT"

      - name: Checkout the Marketplace fork
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FORK_OWNER }}/dify-plugins
          path: dify-plugins
          token: ${{ secrets.PLUGIN_ACTION }}
          fetch-depth: 1

      - name: Commit the package to a branch of the fork
        run: |
          DEST="dify-plugins/${{ steps.manifest.outputs.author }}/${{ steps.manifest.outputs.name }}"
          mkdir -p "$DEST"
          mv "${{ steps.package.outputs.file }}" "$DEST/"
          cd dify-plugins
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Branch from the upstream main, not the fork's copy of it, which lags.
          git remote add upstream https://github.com/langgenius/dify-plugins.git
          git fetch --depth 1 upstream main
          BRANCH="${{ steps.manifest.outputs.name }}-${{ steps.manifest.outputs.version }}"
          git checkout -b "$BRANCH" upstream/main
          git add .
          git commit -m "Update plugin: ${{ steps.manifest.outputs.author }}/${{ steps.manifest.outputs.name }} v${{ steps.manifest.outputs.version }}"
          git push -u origin "$BRANCH" --force

      - name: Open the Marketplace PR
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_ACTION }}
        run: |
          gh pr create \
            --repo langgenius/dify-plugins \
            --head "${{ env.FORK_OWNER }}:${{ steps.manifest.outputs.name }}-${{ steps.manifest.outputs.version }}" \
            --base main \
            --title "Update plugin: ${{ steps.manifest.outputs.author }}/${{ steps.manifest.outputs.name }} v${{ steps.manifest.outputs.version }}" \
            --body-file .github/MARKETPLACE_PR_BODY.md \
            || echo "PR already exists or creation skipped."
